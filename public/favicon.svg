<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bmsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004B87" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="hseFireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Clean White Badge Container with Chamfered Silhouette -->
  <path
    d="M26 6 H94 V74 L74 94 H6 V26 Z"
    fill="#FFFFFF"
    filter="url(#softShadow)"
  />

  <!-- Outer Chamfered Border (Besmindo Emblem Outline) -->
  <path
    d="M26 6 H94 V74 L74 94 H6 V26 Z"
    fill="none"
    stroke="url(#bmsGrad)"
    stroke-width="7"
    stroke-linejoin="miter"
  />

  <!-- Inner Top-Left Chamfer Accent Line -->
  <line x1="33" y1="18" x2="18" y2="33" stroke="url(#bmsGrad)" stroke-width="4.5" stroke-linecap="square" />

  <!-- Geometrical Monogram 'B' (PT Besmindo Inspired) -->
  <!-- Top Loop -->
  <path
    d="M26 26 H72 V48 H26"
    fill="none"
    stroke="url(#bmsGrad)"
    stroke-width="6.5"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Bottom Loop with Chamfered Lower-Right -->
  <path
    d="M26 48 H72 V66 L62 76 H26 Z"
    fill="none"
    stroke="url(#bmsGrad)"
    stroke-width="6.5"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Center Square Cutout in Bottom Loop -->
  <rect x="42" y="55" width="12" height="12" fill="url(#bmsGrad)" rx="1.5" />

  <!-- HSE Fire Safety Accent (APAR Symbol) inside Upper Chamber -->
  <path
    d="M49 17 C49 17 56 22 56 27 C56 31 53 34 49 34 C45 34 42 31 42 27 C42 24 45 20 49 17 Z"
    fill="url(#hseFireGrad)"
  />
  <circle cx="49" cy="28" r="2.2" fill="#FACC15" />
</svg>
